<!DOCTYPE html>
<html>
<head>
  <title>xyzcaller</title>
  <script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2/dist/twilio.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    #status { margin-top: 15px; font-weight: bold; color: #333; }
    #error-log { margin-top: 15px; color: red; font-size: 0.9em; }
  </style>
</head>
<body>
  <h2>xyzcaller</h2>
  
  <label for="dial-number">Number to dial:</label>
  <input type="text" id="dial-number" placeholder="+12345678901">
  
  <button id="call-btn" disabled>Initialize Device...</button>
  <button id="hangup-btn" disabled>Hang Up</button>

  <div id="status">Waiting for initialization...</div>
  <div id="error-log"></div>

  <script>
    const jwtToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCIsImN0eSI6InR3aWxpby1mcGE7dj0xIn0.eyJqdGkiOiJTS2I0ZjVmODQyNDlkNWY3YzY3NzYwOTgzZjNhYTc0MWM5LTE3ODU4MjE1NzYiLCJncmFudHMiOnsiaWRlbnRpdHkiOiJjZWM3MzE0MC1hZmZjLTQyZDAtYTI2Yi0xOTA5ODU1MTA5YzciLCJ2b2ljZSI6eyJvdXRnb2luZyI6eyJhcHBsaWNhdGlvbl9zaWQiOiJBUGRiMTBmZmYzMzk2YWIyNmI2MzgxOGFiZGI5MzM1MTQ4In19fSwiaWF0IjoxNzg1ODIxNTc2LCJleHAiOjE3ODU4MjUxNzYsImlzcyI6IlNLYjRmNWY4NDI0OWQ1ZjdjNjc3NjA5ODNmM2FhNzQxYzkiLCJzdWIiOiJBQzY2NGQ3MmMxYTc0MTAyNmZmNTRhNDllZDI0MWYwMzRlIn0.JJnBuSWcI6cCCjKaHMp11Ziizx9Ciw-flK77h3Yg9rY";
    const callerNumber = "+15123573935"; 

    const statusEl = document.getElementById('status');
    const errorLogEl = document.getElementById('error-log');
    const callBtn = document.getElementById('call-btn');
    const hangupBtn = document.getElementById('hangup-btn');
    const dialInput = document.getElementById('dial-number');

    let device;
    let currentCall;

    (async function initializeTwilio() {
      try {
        device = new Twilio.Device(jwtToken, {
          codecPreferences: ['opus', 'pcmu'],
        });
        
        device.on('registered', () => {
          statusEl.innerText = 'Device registered. Ready to call.';
          callBtn.innerText = 'Call';
          callBtn.disabled = false;
        });

        device.on('error', (twilioError) => {
          statusEl.innerText = 'Device Error.';
          errorLogEl.innerText = twilioError.message;
        });

        await device.register();

      } catch (e) {
        statusEl.innerText = 'Failed to initialize device.';
        errorLogEl.innerText = e.message || 'Check if your JWT token has expired.';
      }
    })();

    callBtn.addEventListener('click', async () => {
      errorLogEl.innerText = '';
      const numberToCall = dialInput.value.trim();
      if (!numberToCall) {
        alert("Please enter a number to dial!");
        return;
      }

      statusEl.innerText = 'Calling ' + numberToCall + '...';
      callBtn.disabled = true;

      try {
        currentCall = await device.connect({
          params: {
            To: numberToCall,
            From: callerNumber 
          }
        });
        
        currentCall.on('accept', () => {
          statusEl.innerText = 'Call connected.';
          hangupBtn.disabled = false;
        });

        currentCall.on('disconnect', (call) => {
          statusEl.innerText = 'Call ended.';
          callBtn.disabled = false;
          hangupBtn.disabled = true;
          
          if (call && call.customParameters && call.customParameters.has('error')) {
             errorLogEl.innerText = 'XYZCaller dropped the call: ' + call.customParameters.get('error');
          }
        });

        currentCall.on('error', (error) => {
          statusEl.innerText = 'Call failed.';
          errorLogEl.innerText = error.message || 'Unknown error occurred';
          callBtn.disabled = false;
        });

      } catch (err) {
        statusEl.innerText = 'Call failed to connect.';
        errorLogEl.innerText = err.message;
        callBtn.disabled = false;
      }
    });

    hangupBtn.addEventListener('click', () => {
      if (currentCall) {
        currentCall.disconnect();
      }
    });
  </script>
</body>
</html>
